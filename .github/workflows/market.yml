name: Market Flow

on:
  schedule:
    # UTC 07:10 = 北京时间 15:10。
    #
    # 必须排在 A 股收盘（15:00）之后：视频画的是当日分钟级资金流曲线，
    # 收盘前跑只能拿到半天的数据，而且末尾那几分钟的集合竞价还没落定。
    # 留十分钟余量，不卡在 15:00 整点上。
    - cron: "10 7 * * *"
    # 备用触发 UTC 07:35 = 北京 15:35。GitHub 的 schedule 是尽力而为，高峰期
    # 常延迟甚至整点跳过；多排一趟兜底。publish.yml 有 gh-pages 串行并发控制，
    # 同日两跑只会以同内容单提交强推，无副作用（根治仍需保持仓库活跃或自托管 runner）。
    - cron: "35 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    uses: ./.github/workflows/publish.yml
    with:
      platforms: xhs_video
    secrets: inherit
