name: Publish

# 两个信息源各有各的定时任务，但从装环境到发布的步骤完全一样，
# 所以抽成可复用工作流，免得两份各自漂移。
on:
  workflow_call:
    inputs:
      platforms:
        description: 传给 ENABLED_PLATFORMS 的平台列表
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 两个定时任务都往 gh-pages 推，撞上了会有一边推不上去。
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Chinese fonts
        run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      # runner 每次都是全新的，dist/ 从空开始。不先把线上站点取回来，
      # 这一趟就会把另一个信息源上次发布的成稿从 Pages 上抹掉。
      - name: Restore the published site
        env:
          TOKEN: ${{ github.token }}
        run: |
          if git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" dist; then
            echo "已取回线上站点：$(ls dist | tr '\n' ' ')"
          else
            echo "gh-pages 尚不存在，从空站点开始"
            mkdir -p dist && git -C dist init -q && git -C dist checkout -q -b gh-pages
          fi

      - name: Generate drafts
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_API_BASE: ${{ secrets.LLM_API_BASE }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ENABLED_PLATFORMS: ${{ inputs.platforms }}
          PUBLIC_DRAFT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python main.py

      - name: Upload publishing bundle
        uses: actions/upload-artifact@v4
        with:
          name: drafts-${{ github.run_number }}
          # dist/ 是个 git 工作副本，别把 .git 目录一起打包进去。
          path: |
            dist/
            !dist/.git
          # 到期 GitHub 自动删，不必另跑清理任务。站点上永远只有各信息源
          # 最新的一期，真正会无限长的只有 Artifact。
          retention-days: 7

      - name: Publish to gh-pages
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          # Pages 默认会跑 Jekyll，下划线开头的文件会被吞掉。
          touch .nojekyll
          # 丢掉历史、重建成单提交再强推。gh-pages 装的是图片和视频，
          # 按天累积提交会让仓库体积只涨不跌，而这些产物的历史版本没人回看
          # ——真要回溯有 Artifact。分支只是发布载体，源码在 main 上。
          rm -rf .git
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "${{ inputs.platforms }} @ $(date -u +%FT%TZ)"
          git push -q --force \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}" HEAD:gh-pages
          echo "站点内容：$(ls | tr '\n' ' ')"

      # 跑挂了才最需要收到信，所以整段都挂 always()。
      # 先垫一份兜底正文再让 Python 覆盖：装依赖或采集阶段就断掉时，
      # tools.mailreport 自己也跑不起来，兜底那份得留住。
      - name: Compose the run report
        id: report
        if: always()
        continue-on-error: true
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PUBLIC_DRAFT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "<p>本次运行没能生成报告，请直接看运行日志。</p>" > run-report.html
          # 163 的 465 端口是隐式 SSL（SMTPS），connection_url 里的 smtp://
          # 不会走 SSL，服务器会直接断连（Unexpected socket close）。所以拆成
          # 显式 server/port/secure/username/password，见下方 Send 步骤。
          if [ -n "${MAIL_USERNAME}" ] && [ -n "${MAIL_PASSWORD}" ] && [ -n "${MAIL_TO}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "未配置 MAIL_USERNAME / MAIL_PASSWORD / MAIL_TO，跳过邮件通知"
          fi
          python -m tools.mailreport

      - name: Send the run report
        if: always() && steps.report.outputs.configured == 'true'
        # 成稿已经推上 gh-pages 了，邮件只是通知——发不出去不该把整趟标红。
        continue-on-error: true
        uses: dawidd6/action-send-mail@v18
        with:
          server_address: smtp.163.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: daily-brief <${{ secrets.MAIL_FROM || secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: ${{ steps.report.outputs.subject || format('daily-brief · {0} 运行报告', inputs.platforms) }}
          html_body: file://run-report.html
          ignore_cert: true
